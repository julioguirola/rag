readme = "README.md"
authors = [{ name = "julioguirola", email = "julioguirola03@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "docx2txt>=0.9",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-nvidia-ai-endpoints>=1.5.0",
