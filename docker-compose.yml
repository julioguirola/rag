services:
  agent-api:
    build: .
    ports:
      - 8000:8000
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - APP_ENV=${APP_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - RATE_LIMIT=${RATE_LIMIT}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS}
      - MAX_RETRIES=${MAX_RETRIES}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_AGENT_ID=${LANGSMITH_AGENT_ID}
      - LANGSMITH_AGENT_ENVIRONMENT=${LANGSMITH_AGENT_ENVIRONMENT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - MINIO_HOST=${MINIO_HOST}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_SECURE=${MINIO_SECURE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - UPLOAD_QUEUE_NAME=${UPLOAD_QUEUE_NAME}
    volumes:
      - ./src/app:/src/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  bucket:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - 9000:9000
      - 9001:9001
    command: server /tmp/minio --console-address :9001

  cache:
    image: redis:8.4.0-bookworm
    ports:
      - 6379:6379

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    ports:
      - 5173:5173
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./front/src:/app/front/src
      - ./front/public:/app/front/public
    restart: unless-stopped

  postgres:
    image: postgres:18.4
    ports:
      - 5674:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
